[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview deploys per PR
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
